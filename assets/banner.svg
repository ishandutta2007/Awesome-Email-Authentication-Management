<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }

    /* Animated background elements */
    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
      50% { transform: scale(1.1) translate(-10px, 15px); opacity: 0.4; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.2; }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .pulse-shape { animation: pulse 8s ease-in-out infinite; transform-origin: center; }
    .dash-line { stroke-dasharray: 8, 12; animation: dash 3s linear infinite; }
    .floating-card { animation: float 6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200" />
    <path d="M100 0V300 M200 0V300 M300 0V300 M400 0V300 M500 0V300 M600 0V300 M700 0V300 M800 0V300 M900 0V300 M1000 0V300 M1100 0V300" />
  </g>

  <!-- Dynamic / Animated Background Orbs -->
  <circle class="pulse-shape" cx="150" cy="80" r="120" fill="url(#glow-grad)" />
  <circle class="pulse-shape" cx="1050" cy="220" r="160" fill="url(#glow-grad)" style="animation-delay: -4s;" />

  <!-- Flow & Verification Visual Lines (Background dynamic graphics) -->
  <g fill="none" opacity="0.4">
    <path class="dash-line" d="M 800 90 L 920 90 Q 950 90 950 120 L 950 180 Q 950 210 980 210 L 1080 210" stroke="#38bdf8" stroke-width="2"/>
    <path class="dash-line" d="M 750 220 L 850 220 Q 880 220 880 190 L 880 140 Q 880 110 910 110 L 1020 110" stroke="#ec4899" stroke-width="2" style="animation-delay: -1.5s;"/>
  </g>

  <!-- Decorative Security Shield (Right side background element) -->
  <g transform="translate(940, 65)" opacity="0.25" class="floating-card">
    <path d="M70 0 L140 35 V105 C140 175 70 210 70 210 C70 210 0 175 0 105 V35 Z" fill="none" stroke="url(#accent-grad)" stroke-width="6"/>
    <path d="M45 105 L62 122 L98 86" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative Protocol Pills (Right side) -->
  <g transform="translate(820, 75)" opacity="0.75" class="floating-card">
    <!-- DMARC Pill -->
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="50" y="21" text-anchor="middle" class="badge-text" fill="#818cf8">DMARC</text>

    <!-- SPF Pill -->
    <rect x="115" y="45" width="80" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="155" y="66" text-anchor="middle" class="badge-text" fill="#38bdf8">SPF</text>

    <!-- DKIM Pill -->
    <rect x="30" y="90" width="90" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="75" y="111" text-anchor="middle" class="badge-text" fill="#c084fc">DKIM</text>

    <!-- BIMI Pill -->
    <rect x="135" y="135" width="85" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="177" y="156" text-anchor="middle" class="badge-text" fill="#f472b6">BIMI</text>
  </g>

  <!-- Left Accent Bar -->
  <rect x="60" y="65" width="8" height="170" rx="4" fill="url(#accent-grad)" />

  <!-- FOREGROUND TEXT (Clear, unhidden, high contrast) -->
  <g transform="translate(90, 0)">
    <!-- Title -->
    <text x="0" y="115" class="title">Awesome Email Authentication</text>
    <text x="0" y="160" class="title" fill="url(#accent-grad)">&amp; Security Management</text>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">Curated SaaS Platforms, Open-Source Parsers, DMARC, SPF, DKIM &amp; BIMI Tools</text>

    <!-- Quick info tags -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#334155" />
      <text x="65" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🛡️ Enterprise SaaS</text>

      <rect x="140" y="0" width="150" height="26" rx="6" fill="#334155" />
      <text x="215" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Open-Source Parsers</text>

      <rect x="300" y="0" width="140" height="26" rx="6" fill="#334155" />
      <text x="370" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📊 Report Analytics</text>
    </g>
  </g>
</svg>
